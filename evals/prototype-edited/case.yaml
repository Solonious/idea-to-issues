schema_version: "1.1"
name: prototype-edited
description: The prototype was edited after the design was approved, so the blueprint stage must stop and name the change.
tags: [release]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  prompt: |
    Run /idea-to-issues:blueprint.
graders:
  - name: ran-the-gate
    type: tool_used
    tool: Bash
    input_match: 'gate require blueprint'
  - name: names-the-change
    type: regex
    pattern: 'docs/design changed after docs/design/index\.md was approved'
  - name: no-blueprint-written
    type: file_exists
    path: 'docs/blueprint.md'
    exists: false
  - name: wrote-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
