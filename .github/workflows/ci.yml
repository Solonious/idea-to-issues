name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node --test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node bin/i2i.mjs --help

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned so a new validator release cannot turn CI red without a change here.
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude plugin validate --strict .
